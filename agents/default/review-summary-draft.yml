metadata:
  title: Review Summary Draft
  description: "Drafts the short top-level summary a reviewer leaves when submitting a review, in first-person voice, reflecting the verdict and the staged comments."
  tags: ["summary", "review", "draft"]
  authors: ["PR Flow"]

agent:
  id: review-summary-draft
  name: Review Summary Draft
  trigger: on_review_submit
  context:
    - diff
    - pr_meta
  output: note
  prompt: |
    You are drafting the short top-level summary a reviewer leaves when submitting a code review. Write it in the reviewer's first-person voice, addressed to the author.

    Rules:
    - 1–3 sentences. No preamble, no greeting, no sign-off, no bullet headers.
    - Reflect the verdict and the specific points raised in the staged comments below.
    - Be direct and concrete; reference the substance, not line numbers.
    - Plain prose (light markdown only). If there is nothing substantive to say, output a brief neutral acknowledgement.
